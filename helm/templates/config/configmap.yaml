kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ template "tc-chatbot-backend.fullname" . }}-api-configmap
  labels:
    component: api-deployment
    environment: {{ .Values.app.environment }}
    release: {{ .Release.Name }}
data:
  # Vector Database
  {{- if .Values.app.redis.enabled }}
  QDRANT_DB_HOST: {{ include "qdrant.fullname" .Subcharts.qdrant | quote }}
  {{- else }}
  QDRANT_DB_HOST: {{ required "env.QDRANT_DB_HOST" .Values.app.env.QDRANT_DB_HOST | quote }}
  {{- end }}
  QDRANT_DB_PORT: {{ required "env.QDRANT_DB_PORT" .Values.app.env.QDRANT_DB_PORT | quote }}
  QDRANT_DB_COLLECTION_NAME: {{ required "env.QDRANT_DB_COLLECTION_NAME" .Values.app.env.QDRANT_DB_COLLECTION_NAME | quote }}

  # Embedding Model
  {{- if .Values.app.embeddingModel.enabled }}
  EMBEDDING_MODEL_URL: http://{{ template "tc-chatbot-backend.fullname" . }}-embedding-model-svc
  {{- else }}
  EMBEDDING_MODEL_URL: {{ required ".Values.env.EMBEDDING_MODEL_URL" .Values.app.env.EMBEDDING_MODEL_URL | quote }}
  {{- end }}
  EMBEDDING_MODEL_NAME: {{ .Values.app.env.EMBEDDING_MODEL_NAME | quote }}
  EMBEDDING_MODEL_VECTOR_SIZE: {{ .Values.app.env.EMBEDDING_MODEL_VECTOR_SIZE | quote }}
  EMBEDDING_MODEL_TYPE: {{ .Values.app.env.EMBEDDING_MODEL_TYPE | quote }}
  OLLAMA_EMBEDDING_MODEL_BASE_URL: {{ .Values.app.env.OLLAMA_EMBEDDING_MODEL_BASE_URL | quote }}
  # LLM Type
  LLM_TYPE: {{ .Values.app.env.LLM_TYPE | quote }}
  LLM_MODEL_NAME: {{ .Values.app.env.LLM_MODEL_NAME | quote }}
  LLM_OLLAMA_BASE_URL: {{ .Values.app.env.LLM_OLLAMA_BASE_URL | quote }}
