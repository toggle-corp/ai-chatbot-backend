{{- if .Values.argoHooks.enableCollectStatic }}

apiVersion: batch/v1
kind: Job
metadata:
  generateName: {{ template "tc-chatbot-backend.fullname" . }}-collectstatic-
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  template:
    spec:
      containers:
        - name: {{ .Chart.Name }}-collectstatic
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "./manage.py"
            - "collectstatic"
            - "--noinput"
      restartPolicy: Nevehoo

{{- end }}
