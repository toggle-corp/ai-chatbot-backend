qdrant:
  enabled: true
  persistence:
    storageClassName: "longhorn"
    accessModes:
      - "ReadWriteOnce"
    size: 2Gi
  resources:
    requests:
      cpu: "100m"
      memory: 100Mi
    limits:
      cpu: "100m"
      memory: 200Mi
  env:
    - name: QDRANT_DB_HOST
      value: "test"
    - name: QDRANT_DB_PORT
      value: "6333"
    - name: QDRANT_DB_COLLECTION_NAME
      value: "test"

streamlit:
  enabled: true
  ingress:
    className: nginx
    enabled: false
    host: "test"
  image:
    name: ghcr.io/toggle-corp/expt-streamlit-chatapp
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 8501
  resources:
    requests:
      cpu: "200m"
      memory: 0.5Gi
    limits:
      cpu: "2"
      memory: 1Gi

embeddingModel:
  enabled: true
  ingress:
     # NOTE: For production don't use this
    className: nginx
    enabled: false
    host: "test"
  image:
    name: ghcr.io/toggle-corp/embedding-models
    tag: latest
    pullPolicy: IfNotPresent
  persistence:  # Used to preserve downloaded models
    storageClassName: ""
    size: "30G"
  replicaCount: 1
  containerPort: 8000
  resources:
    requests:
      cpu: "200m"
      memory: 5Gi
    limits:
      cpu: "2"
      memory: 6Gi
  env:
    EMBEDDING_MODEL_NAME: "sentence-transformers/gtr-t5-large"
    EMBEDDING_MODEL_TYPE: 1
    EMBEDDING_MODEL_VECTOR_SIZE: 768
    OPENAI_API_KEY: test
    OLLAMA_EMBEDDING_MODEL_BASE_URL: "test"
    # LLM Type
    LLM_TYPE: "1"
    LLM_MODEL_NAME: "test"
    LLM_OLLAMA_BASE_URL: "test"

app:
  environment: prod
 
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent
   
  postgresql:
    enabled: true
    architecture: standalone
    fullnameOverride: chatbot-postgresql
    auth:
      database: chatbot
      # NOTE: For production. Use existingSecret.
      # TODO: Pass existingSecret to api/worker instances
      username: chatbot
      password: chatbot
    primary:
      resourcesPreset: "nano"
      persistence:
        enabled: true
        size: 1Gi
        storageClass: "longhorn"

  redis:
    enabled: true
    architecture: standalone
    fullnameOverride: chatbot-redis
    auth:
      enabled: false
    master:
      resourcesPreset: "nano"
      persistence:
        enabled: true
        size: .5Gi
        storageClass: "longhorn"

  argoHooks:
    # NOTE: Make sure key are lowercase
    enabled: true
    resources:
      requests:
        cpu: "0.1"
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 2Gi
    hooks:
      database-migration:
        enabled: true
        hook: PostSync
        preserveHistory: true
        command: ["/bin/bash", "-c"]
        args: 
          - "./manage.py wait_for_resources --db && ./manage.py migrate"
      collect-static:
        enabled: true
        hook: PostSync
        command: ["/bin/bash", "-c"]
        args: 
          - "./manage.py wait_for_resources --minio && ./manage.py collectstatic --noinput"

  api:
    enabled: true
    ingress:
      className: nginx
      enabled: false
      host:
    replicaCount: 1
    containerPort: 80
    command: ["bash", "/code/scripts/run_prod.sh"]
    resources:
      requests:
        cpu: "2"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    
  worker:
    enabled: true
    replicaCount: 1
    command: ["bash", "/code/scripts/run_worker.sh"]
    resources:
      requests:
        cpu: "200m"
        memory: 3Gi
      limits:
        cpu: "2"
        memory: 4Gi

  minio:
    enabled: false
    disableWebUI: true
    mode: standalone
    fullnameOverride: chatbot-minio
    global:
      defaultStorageClass:
    apiIngress:
      enabled: true
      ingressClassName:
      hostname:
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    auth:
      forceNewKeys: True
      rootUser: chatbot
      rootPassword: test
    persistence:
      enabled: true
      size: 1Gi
    defaultBuckets: chatbot-static,chatbot-media  
    provisioning:
      enabled: true
      resourcesPreset: "nano"
      cleanupAfterFinished:
        enabled: true
      extraCommands:
        - "mc anonymous set download provisioning/chatbot-static"
        
  env:
    # APP_ENVIRONMENT:
    DJANGO_DEBUG: "false"
    DJANGO_TIME_ZONE: "UTC"
    DJANGO_ALLOWED_HOST: "*"
    APP_HTTP_PROTOCOL: "https"
    APP_TYPE: "web"
    # App Domain
    APP_DOMAIN: "{{ required \".app.env.APP_DOMAIN\" nil }}"
    APP_FRONTEND_HOST:  "{{ required \".app.env.APP_FRONTEND_HOST\" nil }}"
    # Redis (Required if redis.enabled is false)
    CELERY_REDIS_URL: "redis://{{ printf \"%s-master\" (include \"common.names.fullname\" $.Subcharts.redis) }}:6379/0"
    DJANGO_CACHE_REDIS_URL: "redis://{{ printf \"%s-master\" (include \"common.names.fullname\" $.Subcharts.redis) }}:6379/1"
    # -- Celery
    CELERY_ACCEPT_CONTENT: "json, application/text"
    # Sentry
    SENTRY_TRACES_SAMPLE_RATE: "0.2"
    SENTRY_PROFILE_SAMPLE_RATE: "0.2"
    # S3
    USE_S3_BUCKET: "false"
    AWS_S3_AWS_ENDPOINT_URL: "https://{{ $.Values.minio.apiIngress.hostname}}"
    AWS_S3_REGION: "us-east-1"
    S3_STATIC_BUCKET_NAME: "chatbot-static"
    S3_MEDIA_BUCKET_NAME: "chatbot-media"
    # email
    EMAIL_USE_TLS: "false"
    DEFAULT_FROM_EMAIL: "{{ required \".app.env.DEFAULT_FROM_EMAIL\" nil }}"
    EMBEDDING_MODEL_URL: "{{ template \"tc-chatbot-backend.fullname\" $ }}-embedding-model-svc"
  
  secrets:
    DJANGO_SECRET_KEY: "{{ required \".app.secrets.DJANGO_SECRET_KEY\" nil }}"
    # Database (required if postgresql.enabled if false)
    DATABASE_NAME: "{{ $.Values.postgresql.auth.database}}"
    DATABASE_USER: "{{ $.Values.postgresql.auth.username}}"
    DATABASE_PASSWORD: "{{ $.Values.postgresql.auth.password}}"
    DATABASE_HOST: "{{ include \"postgresql.v1.primary.fullname\" $.Subcharts.postgresql }}"
    DATABASE_PORT: "{{ include \"postgresql.v1.service.port\" $.Subcharts.postgresql }}"
    # Sentry
    SENTRY_DSN: "{{ required \".app.secrets.SENTRY_DSN\" nil }}"
    # OpenAI API key
    OPENAI_API_KEY: "{{ required \".app.secrets.OPENAI_API_KEY\" nil }}"
    # S3 
    AWS_S3_ACCESS_KEY_ID:  "{{ required \".app.minio.auth.rootUser\" $.Values.minio.auth.rootUser }}"
    AWS_S3_SECRET_ACCESS_KEY: "{{ required \".app.minio.auth.rootPassword\" $.Values.minio.auth.rootPassword }}"
    # email 
    EMAIL_HOST: "{{ required \".app.secrets.EMAIL_HOST\" nil }}"
    EMAIL_PORT: "{{ required \".app.secrets.EMAIL_PORT\" nil }}"
    EMAIL_HOST_USER: "{{ required \".app.secrets.EMAIL_HOST_USER\" nil }}"
    EMAIL_HOST_PASSWORD: "{{ required \".app.secrets.EMAIL_HOST_PASSWORD\" nil }}"