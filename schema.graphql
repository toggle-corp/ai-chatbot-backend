"""A generic type to return error messages"""
scalar CustomErrorType

"""Date with time (isoformat)"""
scalar DateTime

enum DepartmentTypeEnum {
  HR
}

type DjangoFileType {
  name: String!
  path: String!
  size: Int!
  url: String!
}

enum DocumentStatusTypeEnum {
  PENDING
  TEXT_EXTRACTED
  ADDED_TO_VECTOR
  DELETED_FROM_VECTOR
  FAILURE
}

enum DocumentTypeEnum {
  WEB_URl
  PDF
  TEXT
}

input LoginInput {
  email: String!
  password: String!
}

type Mutation {
  public: PublicMutation!
  private: PrivateMutation!
}

type MutationEmptyResponseType {
  ok: Boolean!
  errors: CustomErrorType
}

input OffsetPaginationInput {
  offset: Int! = 0
  limit: Int! = -1
}

type PrivateMutation {
  logout: MutationEmptyResponseType!
  changePassword(data: ChangePasswordInput!): MutationEmptyResponseType!
  updateMe(data: UserMeInput!): UserMeTypeMutationResponseType!
  createContent(data: ContentCreateInput!): ContentTypeMutationResponseType!
  readFile(file: Upload!): String!
  updateContentTitle(id: ID!, data: UpdateContentUpdateInput!): ContentTypeMutationResponseType!
  archiveContent(id: ID!, data: archiveUpdateInput!): MutationEmptyResponseType!
  createTag(data: CreateTagCreateInput!): TagTypeMutationResponseType!
  id: ID!
}

type PrivateQuery {
  noop: ID!
  user(pagination: OffsetPaginationInput): UserTypeUserList!
  allUsers: [UserType!]!
  content(pagination: OffsetPaginationInput): ContentTypeCountList!
  tag(pagination: OffsetPaginationInput): ContentTypeCountList!

  """Return all content"""
  allContent: [ContentType!]!
  allTags: [TagType!]!
  id: ID!
}

type PublicMutation {
  login(data: LoginInput!): UserMeTypeMutationResponseType!
  addUser(data: AddUserInput!): MutationEmptyResponseType!
  registerUser(data: RegisterUserInput!): UserTypeMutationResponseType!
  resendInvite(data: UserResendInviteInput!): MutationEmptyResponseType!
  accountActivation(data: UserActivationInput!): MutationEmptyResponseType!
  accountDeactivation(data: UserDeactivationInput!): MutationEmptyResponseType!
  passwordResetTrigger(data: UserPasswordResetTriggerInput!): MutationEmptyResponseType!
  passwordReset(data: UserPasswordReset!): MutationEmptyResponseType!
  forgotPassword(data: ResetUserPassword!): MutationEmptyResponseType!
  id: ID!
}

type PublicQuery {
  me: UserMeType
  content(pagination: OffsetPaginationInput): ContentTypeCountList!
  tag(pagination: OffsetPaginationInput): ContentTypeCountList!

  """Return all content"""
  allContent: [ContentType!]!
  allTags: [TagType!]!
  id: ID!
}

type Query {
  public: PublicQuery!
  private: PrivateQuery!
  enums: AppEnumCollection!
}

