  oldPassword: String!
  newPassword: String!
  confirmNewPassword: String!
}

input ContentCreateInput {
  title: String!
  documentFile: Upload
  tag: [ID!]
  documentType: DocumentTypeEnum
  documentUrl: String
}

type ContentType {
  id: ID!
  title: String!
  extractedFile: DjangoFileType
  createdAt: DateTime!
  tag: [TagNameType!]!
  documentStatus: DocumentStatusTypeEnum!
  documentType: DocumentTypeEnum!
}

type ContentTypeCountList {
  limit: Int!
