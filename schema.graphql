"""
Can only be resolved by authenticated users.

When the condition fails, the following can be returned (following this priority):
1) `OperationInfo`/`OperationMessage` if those types are allowed at the return type
2) `null` in case the field is not mandatory (e.g. `String` or `[String]`)
3) An empty list in case the field is a list (e.g. `[String]!`)
4) An empty `Connection` in case the return type is a relay connection
2) Otherwise, an error will be raised
"""
directive @isAuthenticated repeatable on FIELD_DEFINITION

input AddUserInput {
  emails: String!
}

type AppEnumCollection {
  UserDepartment: [AppEnumCollectionUserDepartment!]!
  MemberRole: [AppEnumCollectionMemberRole!]!
  ContentDocumentStatus: [AppEnumCollectionContentDocumentStatus!]!
  ContentDocumentType: [AppEnumCollectionContentDocumentType!]!
}

type AppEnumCollectionContentDocumentStatus {
  key: DocumentStatusTypeEnum!
  label: String!
}

type AppEnumCollectionContentDocumentType {
  key: DocumentTypeEnum!
  label: String!
}

type AppEnumCollectionMemberRole {
  key: UserRoleEnum!
  label: String!
}

type AppEnumCollectionUserDepartment {
  key: DepartmentTypeEnum!
  label: String!
}

input ArchiveContentInput {
  content: ID!
}

input BoolBaseFilterLookup {
  """Exact match. Filter will be skipped on `null` value"""
  exact: Boolean

  """Assignment test. Filter will be skipped on `null` value"""
  isNull: Boolean

  """
  Exact match of items in a given list. Filter will be skipped on `null` value
  """
  inList: [Boolean!]
}

input ChangePasswordInput {
  oldPassword: String!
  newPassword: String!
}

input ContentCreateInput {
  title: String!
  documentFile: Upload!
  tag: [ID!]
  documentType: DocumentTypeEnum
  documentUrl: String
}

input ContentFilter {
  id: IDBaseFilterLookup
  status: DocumentStatusTypeEnum!
  AND: ContentFilter
  OR: ContentFilter
  NOT: ContentFilter
  DISTINCT: Boolean
}

input ContentOrder {
  id: Ordering
}

type ContentType {
  id: ID!
  title: String!
  extractedFile: DjangoFileType
  createdAt: DateTime!
  tag: [TagNameType!]!
  documentStatus: DocumentStatusTypeEnum!
  documentType: DocumentTypeEnum!
  isDeleted: Boolean!
  contentId: UUID!
  deletedAt: DateTime
  deletedBy: DjangoModelType
  documentFile: DjangoFileType!
}

type ContentTypeMutationResponseType {
  ok: Boolean!
  errors: CustomErrorType
  result: ContentType
}

type ContentTypeOffsetPaginated {
  pageInfo: OffsetPaginationInfo!

  """Total count of existing results."""
  totalCount: Int!

  """List of paginated results."""
  results: [ContentType!]!
}

input CreateTagCreateInput {
  name: String!
  description: String
}

"""A generic type to return error messages"""
scalar CustomErrorType

"""Date with time (isoformat)"""
scalar DateTime

enum DepartmentTypeEnum {
  HR
}

type DjangoFileType {
  name: String!
  path: String!
  size: Int!
  url: String!
}

type DjangoImageType {
  name: String!
  path: String!
  size: Int!
  url: String!
  width: Int!
  height: Int!
}

type DjangoModelType {
  pk: ID!
}

enum DocumentStatusTypeEnum {
  PENDING
  TEXT_EXTRACTED
  ADDED_TO_VECTOR
  DELETED_FROM_VECTOR
  FAILURE
}

enum DocumentTypeEnum {
  WEB_URl
  PDF
  TEXT
}

input IDBaseFilterLookup {
  """Exact match. Filter will be skipped on `null` value"""
  exact: ID

  """Assignment test. Filter will be skipped on `null` value"""
  isNull: Boolean

  """
  Exact match of items in a given list. Filter will be skipped on `null` value
  """
  inList: [ID!]
}

input LoginInput {
  email: String!
  password: String!
}

type Mutation {
  login(data: LoginInput!): UserMeTypeMutationResponseType!
  addUser(data: AddUserInput!): MutationEmptyResponseType!
  registerUser(data: RegisterUserInput!): UserTypeMutationResponseType!
  resendInvite(data: UserResendInviteInput!): MutationEmptyResponseType!
  accountActivation(data: UserActivationInput!): MutationEmptyResponseType!
  accountDeactivation(data: UserDeactivationInput!): MutationEmptyResponseType!
  passwordResetTrigger(data: UserPasswordResetTriggerInput!): MutationEmptyResponseType!
  passwordReset(data: UserPasswordReset!): MutationEmptyResponseType!
  forgotPassword(data: ResetUserPassword!): MutationEmptyResponseType!
  assignRole(data: UserRoleInput!): UserRoleTypeMutationResponseType!
  logout: MutationEmptyResponseType!
  changePassword(data: ChangePasswordInput!): MutationEmptyResponseType!
  updateMe(data: UserMeInput!): UserMeTypeMutationResponseType!
  createContent(data: ContentCreateInput!): ContentTypeMutationResponseType! @isAuthenticated
  readFile(file: Upload!): String! @isAuthenticated
  updateContentTitle(data: UpdateContentTitleInput!): ContentTypeMutationResponseType! @isAuthenticated
  retriggerContent(data: RetriggerContentInput!): ContentTypeMutationResponseType! @isAuthenticated
  archiveContent(data: ArchiveContentInput!): ContentTypeMutationResponseType! @isAuthenticated
  createTag(data: CreateTagCreateInput!): TagTypeMutationResponseType! @isAuthenticated
}

type MutationEmptyResponseType {
  ok: Boolean!
  errors: CustomErrorType
}

type OffsetPaginationInfo {
  offset: Int!
  limit: Int
}

input OffsetPaginationInput {
  offset: Int! = 0
  limit: Int
}

enum Ordering {
  ASC
  ASC_NULLS_FIRST
  ASC_NULLS_LAST
  DESC
  DESC_NULLS_FIRST
  DESC_NULLS_LAST
}

type Query {
  users(pagination: OffsetPaginationInput, filters: UserFilter, order: UserOrder): UserTypeOffsetPaginated! @isAuthenticated
  me: UserMeType
  contents(pagination: OffsetPaginationInput, filters: ContentFilter, order: ContentOrder): ContentTypeOffsetPaginated! @isAuthenticated
  content(pk: ID!): ContentType! @isAuthenticated
  tags(pagination: OffsetPaginationInput, filters: TagFilter): TagTypeOffsetPaginated! @isAuthenticated
  tag(pk: ID!): TagType! @isAuthenticated
  enums: AppEnumCollection!
}

input RegisterUserInput {
  uuid: String!
  token: String!
  password: String!
  firstName: String
  lastName: String
  department: DepartmentTypeEnum
  profilePicture: Upload
}

input ResetUserPassword {
  email: String!
}

input RetriggerContentInput {
  content: ID!
}

input StrFilterLookup {
  """Exact match. Filter will be skipped on `null` value"""
  exact: String

  """Assignment test. Filter will be skipped on `null` value"""
  isNull: Boolean

  """
  Exact match of items in a given list. Filter will be skipped on `null` value
  """
  inList: [String!]

  """Case-insensitive exact match. Filter will be skipped on `null` value"""
  iExact: String

  """
  Case-sensitive containment test. Filter will be skipped on `null` value
  """
  contains: String

  """
  Case-insensitive containment test. Filter will be skipped on `null` value
  """
  iContains: String

  """Case-sensitive starts-with. Filter will be skipped on `null` value"""
  startsWith: String

  """Case-insensitive starts-with. Filter will be skipped on `null` value"""
  iStartsWith: String

  """Case-sensitive ends-with. Filter will be skipped on `null` value"""
  endsWith: String

  """Case-insensitive ends-with. Filter will be skipped on `null` value"""
  iEndsWith: String

  """
  Case-sensitive regular expression match. Filter will be skipped on `null` value
  """
  regex: String

  """
  Case-insensitive regular expression match. Filter will be skipped on `null` value
  """
  iRegex: String
}

input TagFilter {
  name: StrFilterLookup
  AND: TagFilter
  OR: TagFilter
  NOT: TagFilter
  DISTINCT: Boolean
}

type TagNameType {
  id: ID!
  name: String!
}

type TagType {
  id: ID!
  name: String!
  description: String
}

type TagTypeMutationResponseType {
  ok: Boolean!
  errors: CustomErrorType
  result: TagType
}

type TagTypeOffsetPaginated {
  pageInfo: OffsetPaginationInfo!

  """Total count of existing results."""
  totalCount: Int!

  """List of paginated results."""
  results: [TagType!]!
}

scalar UUID

input UpdateContentTitleInput {
  title: String!
  content: ID!
}

scalar Upload

input UserActivationInput {
  uuid: String!
  token: String!
}

input UserDeactivationInput {
  userId: String!
}

input UserFilter {
  id: IDBaseFilterLookup
  isActive: BoolBaseFilterLookup
  displayName: StrFilterLookup
  AND: UserFilter
  OR: UserFilter
  NOT: UserFilter
  DISTINCT: Boolean
}

input UserMeInput {
  firstName: String
  lastName: String
  profilePicture: Upload
}

type UserMeType {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  displayName: String!
  profilePicture: DjangoImageType
}

type UserMeTypeMutationResponseType {
  ok: Boolean!
  errors: CustomErrorType
  result: UserMeType
}

input UserOrder {
  id: Ordering
  displayName: Ordering
}

input UserPasswordReset {
  uuid: String!
  token: String!
  newPassword: String!
}

input UserPasswordResetTriggerInput {
  userId: String!
}

input UserResendInviteInput {
  userId: String!
}

enum UserRoleEnum {
  ADMIN
  USER
}

input UserRoleInput {
  user: ID!
  role: UserRoleEnum
}

type UserRoleType {
  id: ID!
  user: DjangoModelType!
  role: UserRoleEnum!
}

type UserRoleTypeMutationResponseType {
  ok: Boolean!
  errors: CustomErrorType
  result: UserRoleType
}

type UserType {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  isActive: Boolean!
  profilePicture: DjangoImageType
  displayName: String!
  department: DepartmentTypeEnum!
}

type UserTypeMutationResponseType {
  ok: Boolean!
  errors: CustomErrorType
  result: UserType
}

type UserTypeOffsetPaginated {
  pageInfo: OffsetPaginationInfo!

  """Total count of existing results."""
  totalCount: Int!

  """List of paginated results."""
  results: [UserType!]!
}