[project]
authors = [
    {name = "Togglecorp Dev", email = "dev@togglecorp.com"},
]
license = {text = "GNU Affero General Public License v3.0"}
requires-python = "<4.0,>=3.10"
dependencies = [
    "django<6.0,>=5.1",
    "django-environ<1.0.0,>=0.11.2",
    "psycopg2-binary<3.0.0,>=2.9.9",
    "flake8<8.0.0,>=7.1.1",
    "qdrant-client<2.0.0,>=1.11.1",
    "langchain<1.0.0,>=0.2.15",
    "langchain-community<1.0.0,>=0.2.14",
    "langchain-openai<1.0.0,>=0.1.23",
    "ollama<1.0.0,>=0.3.2",
    "langchain-qdrant<1.0.0,>=0.1.3",
    "django-reversion<6.0.0,>=5.1.0",
    "celery<6.0.0,>=5.4.0",
    "redis<6.0.0,>=5.0.8",
    "djangorestframework<4.0.0,>=3.15.2",
    "gunicorn",
    "rank-bm25<1.0.0,>=0.2.2",
    "django-cors-headers<5.0.0,>=4.6.0",
    "strawberry-graphql-django[strawberry-graphql]==0.47.1",
    "pillow<12.0.0,>=11.0.0",
    "sentry-sdk<3.0.0,>=2.22.0",
]
name = "ai-chatbot"
version = "0.1.0"
description = ""
readme = "README.md"


[tool.black]
line-length = 125
# NOTE: Update in .pre-commit-config.yaml as well
extend-exclude = "(__pycache__|.*snap_test_.*\\.py|.*/migrations/.*)"

[tool.isort]
profile = "black"
multi_line_output = 3
skip = [
    "**/__pycache__",
    "**/snap_test_*.py",
    ".venv/",
    "**/migrations/*.py",
]

[tool.pyright]
exclude = [
    "**/__pycache__",
    "**/snap_test_*.py",
    ".venv/",
    "**/migrations/*.py",
]
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"